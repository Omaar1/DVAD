<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVAD — Attack-Path Map</title>
</head>
<body>
<style>
  /* ---- design tokens: light base ---- */
  :root{
    --bg:#eef1f4; --panel:#ffffff; --panel-2:#f4f6f8; --chip:#eef1f4;
    --border:#d5dbe1; --border-2:#e5e9ee;
    --text:#1c2128; --muted:#5a6572; --faint:#8592a0;
    --accent:#8a5a00; --accent-soft:#f4ead2;
    --t-foothold:#0a63c9; --t-privesc:#b5480a; --t-dominance:#c81e2b; --t-lateral:#7440d6;
    --shadow:0 1px 2px rgba(20,28,40,.06),0 8px 24px -12px rgba(20,28,40,.18);
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1117; --panel:#161b22; --panel-2:#0f141a; --chip:#1b222b;
      --border:#2b333d; --border-2:#222a33;
      --text:#e6edf3; --muted:#9aa5b1; --faint:#6e7b89;
      --accent:#e3b341; --accent-soft:#2a2411;
      --t-foothold:#58a6ff; --t-privesc:#f0883e; --t-dominance:#f85149; --t-lateral:#bc8cff;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    }
  }
  /* explicit toggle wins over the media query in both directions */
  :root[data-theme="dark"]{
    --bg:#0d1117; --panel:#161b22; --panel-2:#0f141a; --chip:#1b222b;
    --border:#2b333d; --border-2:#222a33;
    --text:#e6edf3; --muted:#9aa5b1; --faint:#6e7b89;
    --accent:#e3b341; --accent-soft:#2a2411;
    --t-foothold:#58a6ff; --t-privesc:#f0883e; --t-dominance:#f85149; --t-lateral:#bc8cff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
  :root[data-theme="light"]{
    --bg:#eef1f4; --panel:#ffffff; --panel-2:#f4f6f8; --chip:#eef1f4;
    --border:#d5dbe1; --border-2:#e5e9ee;
    --text:#1c2128; --muted:#5a6572; --faint:#8592a0;
    --accent:#8a5a00; --accent-soft:#f4ead2;
    --t-foothold:#0a63c9; --t-privesc:#b5480a; --t-dominance:#c81e2b; --t-lateral:#7440d6;
    --shadow:0 1px 2px rgba(20,28,40,.06),0 8px 24px -12px rgba(20,28,40,.18);
  }

  *{box-sizing:border-box}
  html{color-scheme:light dark}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 72px}

  /* ---- header ---- */
  header.top{
    position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--border);
  }
  .top-in{max-width:1180px; margin:0 auto; padding:14px 20px 12px; display:flex; flex-direction:column; gap:12px}
  .brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .brand h1{
    margin:0; font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.01em;
  }
  .brand h1 .tick{color:var(--accent)}
  .brand p{margin:0; color:var(--muted); font-size:13px}
  .brand p b{color:var(--text); font-weight:600}

  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .search{
    flex:1 1 220px; min-width:180px; display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:7px 11px;
  }
  .search svg{flex:none; color:var(--faint)}
  .search input{
    border:0; outline:0; background:transparent; color:var(--text);
    font-family:var(--sans); font-size:14px; width:100%;
  }
  .search input::placeholder{color:var(--faint)}

  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px}
  .seg button{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--muted);
    background:transparent; border:0; border-radius:6px; padding:6px 11px; cursor:pointer; white-space:nowrap;
  }
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
  .seg button:hover{color:var(--text)}

  .btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--muted);
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 11px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{color:var(--text); border-color:var(--faint)}
  .icon-btn{padding:7px 9px}

  .legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center; padding-top:2px}
  .legend .lg{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
  .legend .dot{width:11px; height:11px; border-radius:3px; flex:none}

  /* ---- sections ---- */
  section.surface{margin-top:26px}
  .sec-head{
    width:100%; display:flex; align-items:center; gap:12px; cursor:pointer;
    background:transparent; border:0; padding:8px 2px; text-align:left; color:var(--text);
  }
  .sec-head .chev{transition:transform .18s ease; color:var(--faint); flex:none}
  .sec-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
  .sec-head h2{margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em}
  .sec-head .host{font-family:var(--mono); font-size:11.5px; color:var(--muted); background:var(--chip); border:1px solid var(--border-2); padding:2px 8px; border-radius:20px}
  .sec-head .count{margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
  .sec-rule{height:1px; background:var(--border); margin:2px 0 16px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px}

  /* ---- vector card ---- */
  .card{
    position:relative; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tier)}
  .card.tier-foothold{--tier:var(--t-foothold)}
  .card.tier-privesc{--tier:var(--t-privesc)}
  .card.tier-dominance{--tier:var(--t-dominance)}
  .card.tier-lateral{--tier:var(--t-lateral)}

  .card-head{
    width:100%; display:flex; align-items:center; gap:11px; text-align:left;
    background:transparent; border:0; cursor:pointer; color:var(--text);
    padding:14px 15px 14px 18px;
  }
  .code{
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.02em;
    color:var(--tier); background:color-mix(in srgb,var(--tier) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--tier) 34%,transparent);
    padding:3px 8px; border-radius:6px; flex:none; white-space:nowrap;
  }
  .card-head .t{flex:1 1 auto; min-width:0}
  .card-head .t .ttl{font-size:14.5px; font-weight:650; letter-spacing:-.01em; display:block}
  .card-head .t .tech{font-size:12px; color:var(--muted); display:block; margin-top:1px}
  .card-head .chev{flex:none; color:var(--faint); transition:transform .18s ease}
  .card.open .card-head .chev{transform:rotate(180deg)}

  .card-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .22s ease}
  .card.open .card-body{grid-template-rows:1fr}
  .card-body > .inner{overflow:hidden; min-height:0}
  .body-pad{padding:4px 16px 16px 18px; border-top:1px solid var(--border-2)}

  /* ---- three facets: why / action / goal ---- */
  .facet{margin-top:15px}
  .flabel{display:block; font-size:10px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--faint); margin-bottom:7px}
  .why{margin:0; font-size:13px; line-height:1.5; color:var(--text)}

  .flow{display:flex; flex-wrap:wrap; align-items:center; gap:6px 3px}
  .node{
    font-family:var(--mono); font-size:11.5px; line-height:1.35;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:5px 9px; border-radius:7px;
  }
  .node.start{border-color:color-mix(in srgb,var(--t-foothold) 55%,var(--border)); color:var(--t-foothold)}
  .node.end{background:color-mix(in srgb,var(--tier) 14%,var(--panel)); border-color:color-mix(in srgb,var(--tier) 45%,var(--border)); color:var(--tier); font-weight:600}
  .arrow{color:var(--faint); font-family:var(--mono); font-size:12px; padding:0 1px}

  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px}
  .tag{font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--chip); border:1px solid var(--border-2); padding:2px 7px; border-radius:5px}
  .tag::before{content:"⛭ "; color:var(--faint)}

  .goalval{
    display:inline-block; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--tier);
    background:color-mix(in srgb,var(--tier) 12%,var(--panel));
    border:1px solid color-mix(in srgb,var(--tier) 40%,var(--border)); padding:6px 11px; border-radius:8px;
  }

  .meta{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; margin-top:16px; padding-top:13px; border-top:1px solid var(--border-2); font-size:12.5px}
  .meta dt{color:var(--faint); font-weight:600}
  .meta dd{margin:0; color:var(--text)}
  .meta dd code, .mono{font-family:var(--mono); font-size:11.5px}
  .note{margin-top:13px; font-size:12px; color:var(--muted); border-left:2px solid var(--border); padding-left:10px}

  .card-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; flex-wrap:wrap}
  .tierchip{font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--tier); display:inline-flex; align-items:center; gap:6px}
  .tierchip .dot{width:8px; height:8px; border-radius:50%; background:var(--tier)}
  a.article{
    font-family:var(--sans); font-size:12.5px; font-weight:650; text-decoration:none;
    color:var(--accent); background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    padding:6px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;
  }
  a.article:hover{filter:brightness(1.04); text-decoration:none}
  .article.soon{color:var(--faint); background:transparent; border:1px dashed var(--border); cursor:not-allowed; font-weight:600}

  .empty{padding:48px 0; text-align:center; color:var(--muted); font-size:14px}

  :where(button,a,input):focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
  @media (max-width:560px){
    .grid{grid-template-columns:1fr}
    .brand h1{font-size:17px}
  }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1><span class="tick">&gt;</span> DVAD // Attack-Path Map</h1>
      <p><b>dvad.lab</b> — expand a vector for why it's vulnerable, how it's exploited, and the goal.</p>
    </div>
    <div class="controls">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Filter by technique, principal, tool…" autocomplete="off" spellcheck="false">
      </label>
      <div class="seg" id="surfaceFilter" role="group" aria-label="Filter by attack surface">
        <button data-surf="all" aria-pressed="true">All</button>
        <button data-surf="ad" aria-pressed="false">AD</button>
        <button data-surf="adcs" aria-pressed="false">AD&nbsp;CS</button>
        <button data-surf="sccm" aria-pressed="false">SCCM</button>
      </div>
      <button class="btn" id="toggleAll" aria-pressed="false"><span id="toggleAllLabel">Expand all</span></button>
      <button class="btn icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>
    <div class="legend" aria-hidden="false">
      <span class="lg"><span class="dot" style="background:var(--t-foothold)"></span>Foothold</span>
      <span class="lg"><span class="dot" style="background:var(--t-privesc)"></span>Privilege escalation</span>
      <span class="lg"><span class="dot" style="background:var(--t-dominance)"></span>Domain dominance</span>
      <span class="lg"><span class="dot" style="background:var(--t-lateral)"></span>Lateral / local</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
/* =====================================================================
   DVAD attack-path data  —  single source of truth for this map.
   Every vector reads as:  why it exists  ->  action + tools  ->  goal.
   To link a walkthrough: set  article: "https://…"  on that vector.
   Leave article: null to show a muted "Article coming soon" badge.
   ===================================================================== */
const SURFACES = [
  {key:"ad",   name:"Active Directory",          host:"DVAD-DC"},
  {key:"adcs", name:"AD Certificate Services",    host:"CA01"},
  {key:"sccm", name:"Configuration Manager",      host:"CM01"},
];
const TIERS = {
  foothold:"Foothold", privesc:"Privilege escalation",
  dominance:"Domain dominance", lateral:"Lateral / local",
};

const DATA = [
  // ---------------- Active Directory ----------------
  { surf:"ad", code:"Chain 1", tier:"dominance", title:"Kerberoasting", tech:"SPN roast of a Domain Admin",
    why:"svc_sqldb is a Domain Admin that carries an SPN (MSSQLSvc/SRV01.dvad.lab:1433) and a weak, crackable password — any authenticated user can request its service ticket.",
    entry:"Any domain user", target:"DVAD-DC",
    path:["Any domain user","Request TGS for svc_sqldb SPN","Crack ticket offline","svc_sqldb = Domain Admin"],
    outcome:"Domain Admin", plant:"domain/configure-attack-paths.ps1",
    tools:["GetUserSPNs.py","Rubeus","hashcat -m 13100"], note:null, article:null },

  { surf:"ad", code:"Chain 2", tier:"privesc", title:"AS-REP roast → Shadow Credentials", tech:"Pre-auth disabled → GenericWrite → PKINIT",
    why:"j.martinez has Kerberos pre-authentication disabled (AS-REP roastable) and holds GenericWrite over r.chen, who sits in the protected Account Operators group.",
    entry:"Any domain user", target:"DVAD-DC",
    path:["j.martinez (pre-auth disabled)","AS-REP roast + crack","GenericWrite on r.chen","Write msDS-KeyCredentialLink","PKINIT via AD CS","r.chen → Account Operators"],
    outcome:"Account Operators", plant:"domain/configure-attack-paths.ps1",
    tools:["GetNPUsers.py","Whisker","certipy shadow","gettgtpkinit"], note:null, article:null },

  { surf:"ad", code:"Chain 3", tier:"dominance", title:"GPP cpassword → Backup Operators", tech:"SYSVOL Group Policy Preferences secret",
    why:"A GPP Services.xml holding a cpassword sits in SYSVOL, readable by any user and reversible with Microsoft's published AES key; the recovered svc_backup is in Backup Operators.",
    entry:"Any authenticated user", target:"DVAD-DC (SYSVOL)",
    path:["Read SYSVOL Policies share","Find Services.xml cpassword","Decrypt (published key)","svc_backup","Backup Operators","Offline NTDS.dit dump"],
    outcome:"NTDS.dit / full domain", plant:"domain/configure-chain3-gpp.ps1",
    tools:["Get-GPPPassword","gpp-decrypt","secretsdump","diskshadow"], note:null, article:null },

  { surf:"ad", code:"Chain 4", tier:"dominance", title:"GPO abuse → SYSTEM on DC", tech:"Delegated edit on a DC-linked GPO",
    why:"The 'DC Security Baseline' GPO is linked to the Domain Controllers OU, and edit rights on it are delegated to the Project-Phoenix group.",
    entry:"Member of Project-Phoenix", target:"DVAD-DC",
    path:["Control a Project-Phoenix member","Edit 'DC Security Baseline' GPO","Linked to Domain Controllers OU","Immediate scheduled task","SYSTEM on the DC"],
    outcome:"SYSTEM on the DC", plant:"domain/configure-chain4-gpo.ps1",
    tools:["SharpGPOAbuse","pyGPOAbuse"],
    note:"Chain 8 (y.chen) is the intended way into Project-Phoenix.", article:null },

  { surf:"ad", code:"Chain 5", tier:"dominance", title:"WriteOwner → gMSA → DCSync", tech:"Group takeover unlocks a replication-capable gMSA",
    why:"d.patel has WriteOwner over GMSA-Readers — the group allowed to retrieve gmsa_svc$'s managed password — and gmsa_svc$ holds directory-replication (DCSync) rights.",
    entry:"d.patel", target:"DVAD-DC",
    path:["d.patel WriteOwner on GMSA-Readers","Take ownership, add self","Read gmsa_svc$ password","gmsa_svc$ has replication rights","DCSync"],
    outcome:"DCSync (all domain hashes)", plant:"domain/configure-attack-paths.ps1",
    tools:["PowerView","bloodyAD","gMSADumper","secretsdump -just-dc"], note:null, article:null },

  { surf:"ad", code:"Chain 6a", tier:"dominance", title:"Unconstrained delegation", tech:"Coerce the DC, capture its TGT",
    why:"SRV01$ is trusted for unconstrained delegation, so any authentication it can coerce — including a Domain Controller — leaves a reusable TGT in its memory.",
    entry:"Control of SRV01$", target:"SRV01 → DVAD-DC",
    path:["SRV01$ TrustedForDelegation","Coerce DC auth (PetitPotam / PrinterBug)","Capture DC TGT from memory","DCSync"],
    outcome:"Domain Admin via DCSync", plant:"domain/prestage-machine-attacks.ps1",
    tools:["Rubeus monitor","PetitPotam","printerbug"], note:null, article:null },

  { surf:"ad", code:"Chain 6b", tier:"dominance", title:"Constrained delegation", tech:"Protocol transition (S4U) to CIFS/DC",
    why:"svc_web is configured for constrained delegation to CIFS/DVAD-DC with protocol transition (TrustedToAuthForDelegation), so it can obtain tickets as any user.",
    entry:"svc_web", target:"DVAD-DC",
    path:["svc_web → CIFS/DVAD-DC (AllowedToDelegateTo)","Protocol transition","S4U2Self + S4U2Proxy","Impersonate Administrator"],
    outcome:"Administrator on the DC", plant:"domain/prestage-machine-attacks.ps1",
    tools:["getST.py -impersonate"], note:null, article:null },

  { surf:"ad", code:"Chain 6c", tier:"lateral", title:"Resource-based constrained delegation", tech:"GenericWrite lets attacker set RBCD",
    why:"l.garcia has GenericWrite over CA01$, and MachineAccountQuota is 10 — so any user can add a computer and configure RBCD against CA01.",
    entry:"l.garcia", target:"CA01",
    path:["l.garcia GenericWrite on CA01$","Add a computer (MAQ=10)","Set msDS-AllowedToActOnBehalfOfOtherIdentity","S4U → CA01"],
    outcome:"SYSTEM on CA01", plant:"domain/prestage-machine-attacks.ps1",
    tools:["rbcd.py","bloodyAD","getST.py"], note:null, article:null },

  { surf:"ad", code:"Chain 7", tier:"lateral", title:"LAPS password read", tech:"AllExtendedRights reads ms-Mcs-AdmPwd",
    why:"t.brown holds AllExtendedRights over SRV01$, which grants read access to the confidential ms-Mcs-AdmPwd (LAPS) attribute — the local Administrator password.",
    entry:"t.brown", target:"SRV01",
    path:["t.brown AllExtendedRights on SRV01$","Read ms-Mcs-AdmPwd","Local Administrator password"],
    outcome:"Local admin on SRV01", plant:"domain/prestage-machine-attacks.ps1",
    tools:["netexec -M laps","Get-ADComputer ms-Mcs-AdmPwd"],
    note:"Schema extended by install-laps-schema.ps1.", article:null },

  { surf:"ad", code:"Chain 8", tier:"foothold", title:"Anonymous bind → description leak", tech:"Unauthenticated LDAP reads a cleartext password",
    why:"dSHeuristics enables anonymous LDAP bind and ANONYMOUS LOGON has read over the domain head; y.chen's cleartext password is stored in her description attribute.",
    entry:"Unauthenticated (network)", target:"DVAD-DC",
    path:["Anonymous LDAP bind (dSHeuristics)","Read y.chen description","Cleartext password","Authenticated foothold"],
    outcome:"Domain foothold → Chain 4", plant:"tools/enable-anonymous-bind.ps1",
    tools:["ldapsearch -x","netexec ldap"],
    note:"y.chen is in Project-Phoenix, feeding the Chain 4 GPO abuse.", article:null },

  // ---------------- AD Certificate Services ----------------
  { surf:"adcs", code:"ESC1", tier:"dominance", title:"Enrollee-supplied SAN", tech:"Arbitrary SAN on a client-auth cert",
    why:"The ESC1 template allows low-privileged enrollment, has a client-authentication EKU, and lets the enrollee supply an arbitrary Subject Alternative Name.",
    entry:"Any domain user", target:"CA01",
    path:["Enroll in the ESC1 template","Supply SAN = Administrator","Client-auth certificate","Authenticate as Administrator"],
    outcome:"Domain Admin", plant:"services/ADCS/install-adcs.ps1",
    tools:["certipy req","Rubeus asktgt /certificate"], note:null, article:null },

  { surf:"adcs", code:"ESC2", tier:"dominance", title:"Any Purpose EKU", tech:"Unrestricted EKU on an enrollable template",
    why:"The ESC2 template carries an Any Purpose (or no) EKU, so a certificate issued from it can be used for client authentication.",
    entry:"Any domain user", target:"CA01",
    path:["Enroll in the ESC2 template","Any Purpose / no EKU restriction","Use certificate for client auth"],
    outcome:"Domain Admin", plant:"services/ADCS/install-adcs.ps1",
    tools:["certipy req"], note:null, article:null },

  { surf:"adcs", code:"ESC3", tier:"dominance", title:"Enrollment Agent", tech:"Request a cert on behalf of another principal",
    why:"An Enrollment Agent template is enrollable by low-privileged users, letting them request certificates on behalf of a Domain Admin.",
    entry:"Any domain user", target:"CA01",
    path:["Enroll in the Enrollment Agent template","Request on behalf of a Domain Admin","Obtain a DA certificate"],
    outcome:"Domain Admin", plant:"services/ADCS/install-adcs.ps1",
    tools:["certipy req -on-behalf-of"], note:null, article:null },

  { surf:"adcs", code:"ESC4", tier:"dominance", title:"Template ACL", tech:"Domain Users hold GenericAll on a template",
    why:"Domain Users have GenericAll over a certificate template, so it can be rewritten into a vulnerable (ESC1-style) configuration and then abused.",
    entry:"Any domain user", target:"CA01",
    path:["GenericAll on a certificate template","Rewrite the template to be ESC1","Enroll with an arbitrary SAN"],
    outcome:"Domain Admin", plant:"services/ADCS/install-adcs.ps1",

/* ---------- rendering ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function flowHtml(path){
  return path.map((n,i)=>{
    const cls = i===0 ? "node start" : (i===path.length-1 ? "node end" : "node");
    const arr = i<path.length-1 ? '<span class="arrow">→</span>' : "";
    return `<span class="${cls}">${esc(n)}</span>${arr}`;
  }).join("");
}

function cardHtml(v, idx){
  const tools = v.tools.map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const article = v.article
    ? `<a class="article" href="${esc(v.article)}" target="_blank" rel="noopener">Read walkthrough →</a>`
    : `<span class="article soon" aria-disabled="true" title="Walkthrough not published yet">Article coming soon</span>`;
  const note = v.note ? `<p class="note">${esc(v.note)}</p>` : "";
  const hay = [v.code,v.title,v.tech,v.why,v.entry,v.outcome,v.target,...v.path,...v.tools,v.note||""].join(" ").toLowerCase();
  return `
  <article class="card tier-${v.tier}" data-surf="${v.surf}" data-tier="${v.tier}" data-hay="${esc(hay)}">
    <button class="card-head" aria-expanded="false" id="h${idx}" aria-controls="b${idx}">
      <span class="code">${esc(v.code)}</span>
      <span class="t"><span class="ttl">${esc(v.title)}</span><span class="tech">${esc(v.tech)}</span></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="card-body" id="b${idx}" role="region" aria-labelledby="h${idx}"><div class="inner"><div class="body-pad">
      <div class="facet">
        <span class="flabel">Requirement — why it's vulnerable</span>
        <p class="why">${esc(v.why)}</p>
      </div>
      <div class="facet">
        <span class="flabel">Action &amp; tools</span>
        <div class="flow">${flowHtml(v.path)}</div>
        <div class="tags">${tools}</div>
      </div>
      <div class="facet">
        <span class="flabel">Goal</span>
        <span class="goalval">${esc(v.outcome)}</span>
      </div>
      <dl class="meta">
        <dt>Entry</dt><dd class="mono">${esc(v.entry)}</dd>
        <dt>Target</dt><dd class="mono">${esc(v.target)}</dd>
        <dt>Planted by</dt><dd><code>${esc(v.plant)}</code></dd>
      </dl>
      ${note}
      <div class="card-foot">
        <span class="tierchip"><span class="dot"></span>${esc(TIERS[v.tier])}</span>
        ${article}
      </div>
    </div></div></div>
  </article>`;
}

function render(){
  let idx = 0, html = "";
  for(const s of SURFACES){
    const items = DATA.filter(v=>v.surf===s.key);
    const cards = items.map(v=>cardHtml(v, idx++)).join("");
    html += `
    <section class="surface" data-surf="${s.key}">
      <button class="sec-head" aria-expanded="true" data-sec="${s.key}">
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
        <h2>${esc(s.name)}</h2><span class="host">${esc(s.host)}</span>
        <span class="count" data-count="${s.key}">${items.length}</span>
      </button>
      <div class="sec-rule"></div>
      <div class="grid">${cards}</div>
    </section>`;
  }
  html += `<div class="empty" id="empty" hidden>No vectors match your filter.</div>`;
  app.innerHTML = html;
  wire();
}

/* ---------- interaction ---------- */
let allOpen = false;
function wire(){
  app.querySelectorAll(".card-head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const card = btn.closest(".card");
      const open = card.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  });
  app.querySelectorAll(".sec-head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const sec = btn.closest(".surface");
      const grid = sec.querySelector(".grid");
      const open = btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      grid.style.display = open ? "none" : "";
    });
  });
}

function applyFilters(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const surf = document.querySelector('#surfaceFilter button[aria-pressed="true"]').dataset.surf;
  let anyVisible = false;
  for(const s of SURFACES){
    const sec = app.querySelector(`.surface[data-surf="${s.key}"]`);
    let shown = 0;
    sec.querySelectorAll(".card").forEach(card=>{
      const okSurf = surf==="all" || card.dataset.surf===surf;
      const okQ = !q || card.dataset.hay.includes(q);
      const vis = okSurf && okQ;
      card.style.display = vis ? "" : "none";
      if(vis) shown++;
    });
    sec.style.display = shown ? "" : "none";
    sec.querySelector(`[data-count="${s.key}"]`).textContent = shown;
    if(shown) anyVisible = true;
  }
  document.getElementById("empty").hidden = anyVisible;
}

document.getElementById("q").addEventListener("input", applyFilters);
document.getElementById("surfaceFilter").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#surfaceFilter button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  applyFilters();
});
document.getElementById("toggleAll").addEventListener("click", ()=>{
  allOpen = !allOpen;
  app.querySelectorAll(".card").forEach(card=>{
    if(card.style.display==="none") return;
    card.classList.toggle("open", allOpen);
    card.querySelector(".card-head").setAttribute("aria-expanded", allOpen?"true":"false");
  });
  document.getElementById("toggleAllLabel").textContent = allOpen ? "Collapse all" : "Expand all";
  document.getElementById("toggleAll").setAttribute("aria-pressed", allOpen?"true":"false");
});

/* theme toggle (standalone); the artifact host also stamps data-theme */
document.getElementById("theme").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});

render();
</script>
